
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cedarbridge IT Support</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 40px;
        }

        main {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            color: #203354;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            background: #175cd3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <main>
        <h1>Cedarbridge IT Support</h1>
        <p>Submit an IT support request below.</p>

        <form action="/tickets" method="post">

            <label for="requester_name">Requester Name</label>
            <input
                type="text"
                id="requester_name"
                name="requester_name"
                required
            >

            <label for="requester_email">Contact Email</label>
            <input
                type="email"
                id="requester_email"
                name="requester_email"
                required
            >

            <label for="category">Issue Category</label>
            <select id="category" name="category" required>
                <option value="">Select a category</option>
                <option value="hardware">Hardware</option>
                <option value="software">Software</option>
                <option value="network">Network</option>
                <option value="access">Account / Access</option>
                <option value="other">Other</option>
            </select>

            <label for="description">Issue Description</label>
            <textarea
                id="description"
                name="description"
                rows="5"
                required
            ></textarea>

            <button type="submit">Submit Ticket</button>

        </form>
    </main>
</body>
</html>
